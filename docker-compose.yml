services:  engine:    build: .    image: cryptic-core-engine:latest    user: "${UID:-1000}:${GID:-1000}"    volumes:      - ./data/in:/app/data/in:ro      - ./data/out:/app/data/out:rw    environment:      - OTEL_SERVICE_NAME=cryptic-core      - OTEL_TRACES_EXPORTER=otlp      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317      - OTEL_METRICS_EXPORTER=none      - OTEL_LOGS_EXPORTER=none    depends_on:      jaeger:        condition: service_started  jaeger:    image: jaegertracing/jaeger:latest    container_name: cc-jaeger    ports:      - "16686:16686"      - "4317:4317"      - "4318:4318"